services:
  db:
    image: postgres:17@sha256:846a7ddaa67a4b354ae1d21087b683901aa6113a4ed626d3787cfbf6c85e3e07  # pinned: same build for every developer
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    # no ports: DB only reachable by Odoo (host 5432 is used by another project)

  odoo:
    image: odoo:20.0@sha256:8bcae4c1f895683ee851e19dd3e7d999e81e770defe9015bc9dad8bbf10f2b0d  # pinned build 20.0-20261112; bump deliberately (ADR 0004)
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "127.0.0.1:${ODOO_PORT:-8069}:8069"
    environment:
      HOST: db
      USER: ${POSTGRES_USER:?set in .env}
      PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      # vela_analytics → Kafka bridge (ADR 0010). Default local: no network, Odoo works alone.
      VELA_DELIVERY_MODE: ${VELA_DELIVERY_MODE:-local}
      VELA_BRIDGE_URL: ${VELA_BRIDGE_URL:-}
      VELA_BRIDGE_TOKEN: ${VELA_BRIDGE_TOKEN:-}
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons

volumes:
  odoo-db-data:
  odoo-web-data:
