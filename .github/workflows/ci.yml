name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Newer pushes to the same PR/branch cancel the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUFF_VERSION: "0.17.5"
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1

jobs:
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Ruff (Python lint)
        run: |
          pip install --quiet --only-binary :all: "ruff==${RUFF_VERSION}"   # wheels only: no setup.py runs
          ruff check --output-format=github addons scripts .claude/hooks

      - name: Static checks (XML, JSON, Python syntax, manifests, vela_setup depends)
        run: python3 scripts/ci/static_checks.py

      - name: ShellCheck
        run: shellcheck -S warning scripts/*.sh .claude/hooks/*.sh

      - name: Guard hook tests
        run: .claude/hooks/bash-guard.test.sh

      - name: Catalog validation (131 products, images, credits)
        run: python3 scripts/catalog/validate.py

      - name: Image credits are up to date
        run: |
          python3 scripts/catalog/credits.py
          git diff --exit-code -- addons/vela_tech_catalog/IMAGE_CREDITS.md \
            || { echo "::error::IMAGE_CREDITS.md is stale: run python3 scripts/catalog/credits.py"; exit 1; }

      - name: Workflow files (actionlint)
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.7 -no-color

      - name: docker-compose.yml is valid
        run: |
          cp .env.example .env
          docker compose config --quiet

  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # scan the whole history, not just the tip

      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo:ro" "${GITLEAKS_IMAGE}" git /repo --redact --no-banner -v

  # ---------------------------------------------------------------------------
  store:
    name: Build store from scratch + browser checks
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"      # page_check.mjs uses the built-in WebSocket

      # Exactly what a new teammate runs: config from templates, pinned images,
      # DB created like the web form (country TN), vela_setup installs everything.
      - name: Bootstrap the store (scripts/setup.sh)
        run: ./scripts/setup.sh

      - name: Upgrade is idempotent (scripts/update.sh)
        run: ./scripts/update.sh

      - name: No drift between the DB and git
        run: ./scripts/drift.sh

      - name: Store smoke test
        run: |
          set -euo pipefail
          # update.sh restarts Odoo: wait until it answers (max 90 s)
          for _ in $(seq 1 45); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8069/web/login)" = "200" ] && break
            sleep 2
          done
          for path in / /shop /shop/cart /shop/wishlist /web/login /web/signup; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8069${path}")
            echo "${path} -> ${code}"
            [ "$code" = "200" ] || { echo "::error::${path} returned ${code}"; exit 1; }
          done
          q() { docker compose exec -T db psql -U odoo -d CommercePulse -Atc "$1"; }
          products=$(q "select count(*) from product_template t where exists (select 1 from product_product p where p.product_tmpl_id = t.id and p.default_code like 'VT-%')")
          echo "catalog products: ${products}"
          [ "$products" -ge 131 ] || { echo "::error::expected 131 catalog products, got ${products}"; exit 1; }
          company=$(q "select name from res_company limit 1")
          [ "$company" = "Vela Tech" ] || { echo "::error::company is '${company}', vela_setup did not apply"; exit 1; }

      - name: Warm up asset bundles (first request compiles JS/CSS)
        run: |
          for path in / /shop /web/login; do curl -s -o /dev/null "http://127.0.0.1:8069${path}"; done
          sleep 5

      - name: Resolve a product page
        id: product
        run: |
          pid=$(docker compose exec -T db psql -U odoo -d CommercePulse -Atc \
            "select product_tmpl_id from product_product where default_code like 'VT-HPH-001%' limit 1")
          echo "path=/shop/p-${pid}" >> "$GITHUB_OUTPUT"     # Odoo redirects to the canonical slug

      # Step outputs go through env, never `${{ }}` inside `run:` (script injection).
      - name: Page checks, light (overflow, JS errors, tracking contract)
        env:
          PRODUCT_PATH: ${{ steps.product.outputs.path }}
        run: |
          node scripts/page_check.mjs artifacts/light \
            / /shop "$PRODUCT_PATH" /shop/cart /shop/wishlist "/shop?search=zzzqqq" /web/login /web/signup \
            --reduced-motion --strict

      - name: Page checks, dark
        env:
          PRODUCT_PATH: ${{ steps.product.outputs.path }}
        run: |
          node scripts/page_check.mjs artifacts/dark \
            / /shop "$PRODUCT_PATH" /shop/cart /shop/wishlist "/shop?search=zzzqqq" /web/login /web/signup \
            --reduced-motion --dark --strict

      - name: Collect Odoo logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color odoo > artifacts/odoo.log 2>&1 || true
          if grep -n "error occurred while compiling" artifacts/odoo.log; then
            echo "::error::an SCSS asset bundle failed to compile"; exit 1
          fi

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-check-${{ github.run_id }}
          path: artifacts/
          retention-days: 14
