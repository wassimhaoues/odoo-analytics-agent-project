# Python lint for our addons and scripts (CI: .github/workflows/ci.yml)
target-version = "py312"
line-length = 120
extend-exclude = [
    ".claude/skills/ui-ux-pro-max",   # vendored third-party skill
    "scripts/catalog/.cache",
]

[lint]
# pyflakes, pycodestyle errors/warnings, bugbear, pyupgrade, import order
select = ["F", "E", "W", "B", "UP", "I"]
ignore = [
    "E501",    # long lines: data-heavy dict literals in the loader
]

[lint.per-file-ignores]
"addons/*/__init__.py" = ["F401"]          # Odoo imports submodules for registration
"addons/*/__manifest__.py" = ["B018"]      # a manifest is a bare dict expression

[lint.isort]
known-first-party = ["odoo"]
